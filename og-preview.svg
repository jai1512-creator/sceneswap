<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627" style="background:#070709; font-family:'Cinzel', serif;">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1B28" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#070709" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5C07B" stop-opacity="0" />
      <stop offset="30%" stop-color="#E5C07B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="70%" stop-color="#FF2A6D" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF2A6D" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#glow)" />

  <!-- Subtle grid lines -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#252736" stroke-width="1" opacity="0.4" />
  <line x1="80" y1="547" x2="1120" y2="547" stroke="#252736" stroke-width="1" opacity="0.4" />
  <line x1="80" y1="80" x2="80" y2="547" stroke="#252736" stroke-width="1" opacity="0.4" />
  <line x1="1120" y1="80" x2="1120" y2="547" stroke="#252736" stroke-width="1" opacity="0.4" />

  <!-- Lens/Aperture Mark -->
  <g transform="translate(600, 190)">
    <circle cx="0" cy="0" r="46" stroke="#E5C07B" stroke-width="1.5" stroke-dasharray="6 3" fill="none" opacity="0.8" />
    <circle cx="0" cy="0" r="32" stroke="#00F0FF" stroke-width="1.5" fill="none" opacity="0.8" />
    <polygon points="0,-18 16,14 -16,14" stroke="#FF2A6D" stroke-width="1.5" fill="none" opacity="0.9" />
    <circle cx="0" cy="0" r="4" fill="#FAFBFD" />
  </g>

  <!-- Header Category -->
  <text x="600" y="275" fill="#E5C07B" font-size="14" font-weight="600" letter-spacing="8" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">CINEMATIC AESTHETIC DISCOVERY</text>

  <!-- Main Title -->
  <text x="600" y="340" fill="#FAFBFD" font-size="58" font-weight="700" letter-spacing="12" text-anchor="middle">SCENESWAP</text>

  <!-- Tagline -->
  <text x="600" y="385" fill="#B8BFDE" font-size="20" font-weight="300" font-style="italic" letter-spacing="3" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, serif">“Step into the aesthetic of a scene.”</text>

  <!-- Divider Line -->
  <rect x="420" y="415" width="360" height="2" fill="url(#accentLine)" />

  <!-- Description -->
  <text x="600" y="455" fill="#8A91B4" font-size="15" font-weight="400" letter-spacing="1" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif">COLOR · TYPOGRAPHY · LIGHTING · MUSIC · INTERIOR · OUTFIT · ENVIRONMENT</text>

  <!-- Palette preview swatches at bottom -->
  <g transform="translate(450, 485)">
    <rect x="0" y="0" width="50" height="12" rx="2" fill="#00F0FF" />
    <rect x="65" y="0" width="50" height="12" rx="2" fill="#FF2A6D" />
    <rect x="130" y="0" width="50" height="12" rx="2" fill="#E5C07B" />
    <rect x="195" y="0" width="50" height="12" rx="2" fill="#8C6239" />
    <rect x="250" y="0" width="50" height="12" rx="2" fill="#1F3B34" />
  </g>
</svg>
